name: Discord ravens poll

# Watches the latest Winds of the World page and posts entries of interest to the
# Sablier Rouge Discord. Self-contained: it fetches the wiki itself and needs no
# embedding model, so unlike the ingest job there is no model cache step.
on:
  schedule:
    # Daily at 16:07 UTC, offset from the ingest job (15:37) to spread load.
    - cron: "7 16 * * *"
  workflow_dispatch:

# Never let a manual run overlap a scheduled one against the same database.
concurrency:
  group: discord-poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONCORD_WIKI_BASE_URL: ${{ secrets.CONCORD_WIKI_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CONCORD_CROW_MODEL: ${{ secrets.CONCORD_CROW_MODEL }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Poll the Winds
        run: bun run discord:poll
