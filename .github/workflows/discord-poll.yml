name: Discord ravens poll

# Watches the latest Winds of the World page and posts entries of interest to the
# Sablier Rouge Discord. It fetches the wiki itself, and it also retrieves wiki
# background for each entry so the ravens judge relevance against the setting, so
# like the ingest job it needs the embedding model and caches it between runs.
on:
  schedule:
    # Four times a day, evenly spaced across 8am-8pm Perth time (AWST = UTC+8):
    # 08:00 / 12:00 / 16:00 / 20:00 AWST is 00:00 / 04:00 / 08:00 / 12:00 UTC.
    # Minute 7 keeps runs off the top of the hour (GitHub's scheduling backlog).
    - cron: "7 0,4,8,12 * * *"
  workflow_dispatch:

# Never let a manual run overlap a scheduled one against the same database.
concurrency:
  group: discord-poll
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CONCORD_WIKI_BASE_URL: ${{ secrets.CONCORD_WIKI_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CONCORD_CROW_MODEL: ${{ secrets.CONCORD_CROW_MODEL }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      # The embedding model is downloaded here so actions/cache can persist it
      # between runs instead of re-downloading ~130MB each time.
      TRANSFORMERS_CACHE_DIR: ${{ github.workspace }}/.transformers-cache
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.transformers-cache
          # The key tracks embedding.ts, so changing the model or dtype pulls a
          # fresh download; the restore-key still reuses a prior model otherwise.
          key: transformers-model-${{ hashFiles('src/retrieval/embedding.ts') }}
          restore-keys: |
            transformers-model-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Poll the Winds
        run: bun run discord:poll
